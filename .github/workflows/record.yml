name: Record a live run
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Check the key is set
        run: test -n "$ANTHROPIC_API_KEY" || (echo "Add the ANTHROPIC_API_KEY repo secret first" && exit 1)
      - name: Live note triage, 30 notes x 3 runs, with the judge
        run: |
          rm -f recordings/*.jsonl
          GOLIVE_LIVE=1 golive run evals/notes/golive.live.yml --out reports/notes && rc=0 || rc=$?
          echo "notes gate exit code: $rc" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "NOTES_RC=$rc" >> "$GITHUB_ENV"
      - name: Stage timeline from the recorded triage, then this week's fact sheets
        run: python scripts/run_shifts.py
      - name: Live weekly customer updates, with the judge
        run: |
          GOLIVE_LIVE=1 golive run evals/summary/golive.live.yml --out reports/summary && rc=0 || rc=$?
          echo "weekly update gate exit code: $rc" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "SUMMARY_RC=$rc" >> "$GITHUB_ENV"
      - name: Refuse partial recordings
        run: |
          cat reports/notes/report.md reports/summary/report.md 2>/dev/null | grep -iE "error" | head -20 || true
          set -e
          test "$(wc -l < recordings/notes_agent.jsonl)" -eq 90
          test "$(wc -l < recordings/notes_judge.jsonl)" -eq 90
          test "$(wc -l < recordings/summary_agent.jsonl)" -eq 3
          test "$(wc -l < recordings/summary_judge.jsonl)" -eq 3
      - name: Publish only a passing run
        run: |
          cat reports/notes/report.md reports/summary/report.md | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$NOTES_RC" != "0" ] || [ "$SUMMARY_RC" != "0" ]; then
            echo "A live gate did not pass (see the reports above); nothing published." && exit 1
          fi
      - name: Rebuild the demo page from the recordings
        run: python scripts/build_demo.py
      - name: Commit recordings and demo, publish Pages
        run: |
          git config user.name "Pranav Gudise"
          git config user.email "273664482+pg2342-hub@users.noreply.github.com"
          git add recordings docs data evals/summary/cases.yml
          git commit -m "Record a live Claude run and rebuild the demo"
          git push
          git subtree split --prefix docs -b gh-pages
          git push -f origin gh-pages
      - name: Run CI on the new commit (pushes made by this workflow do not trigger it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}"
      - name: Keep a failed run for diagnosis on its own branch (main and Pages stay as they were)
        if: failure()
        run: |
          git config user.name "Pranav Gudise"
          git config user.email "273664482+pg2342-hub@users.noreply.github.com"
          git checkout -B record/last-failed
          git add -f recordings reports || true
          git commit -qm "Failed live run, kept for diagnosis (not published)" || true
          git push -f origin record/last-failed
