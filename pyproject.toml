[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-cabling-gate"
version = "0.1.0"
description = "Go-live gate for a supervised robot cabling pilot in an AI data center"
requires-python = ">=3.10"
dependencies = ["golive-gate[claude]>=0.1.1,<0.2", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["cabling"]

[tool.setuptools.package-data]
cabling = ["triage_guide.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["cabling"]
known-third-party = ["golive_gate"]
